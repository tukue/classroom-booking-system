services:
  database:
    image: postgres:17-alpine
    container_name: classroom-booking-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classroom_booking}
      POSTGRES_USER: ${POSTGRES_USER:-classroom_app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - classroom-booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  classroom-booking-data:
